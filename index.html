
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mozart y tú</title>

    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 15px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 40px;
        }

        .audio-container {
            max-width: 500px;
            margin: 0 auto 30px;
        }

        h2 {
            font-size: 20px;
            font-weight: normal;
            margin-bottom: 12px;
        }

        audio {
            width: 100%;
        }
    </style>
</head>

<body>

    <h1>🎵 MOZART Y TÚ 🎵</h1>

    <div class="audio-container">
        <h2>¿Qué instrumento está sonando?</h2>
        <audio controls>
            <source src="piano.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="audio-container">
        <h2>¡A ritmo de Mozart!</h2>
        <audio controls>
            <source src="marcha.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="audio-container">
        <h2>¡Papa-dúo!</h2>
        <audio controls>
            <source src="duo.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="audio-container">
        <h2>¡La Reina de la Noche canta!</h2>
        <audio controls>
            <source src="aria.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="audio-container">
        <h2>¡De excursión con el pajarero!</h2>
        <audio controls>
            <source src="papageno.mp3" type="audio/mpeg">
        </audio>
    </div>

</body>
</html>
